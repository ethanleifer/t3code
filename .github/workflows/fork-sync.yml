name: Fork Sync

# Merges pingdotgg/t3code main into this fork's main every day. The push
# starts Fork Release. A conflict fails the run and leaves main untouched;
# resolve it locally with `git merge upstream/main`.
#
# FORK_SYNC_TOKEN is a fine-grained token for this repository with Contents
# and Workflows write: the default token cannot push upstream's workflow edits,
# and its pushes would not start Fork Release.

on:
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Merge upstream main
    if: github.repository == 'ethanleifer/t3code'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # checkout's credential cleanup fails on the orphaned gitlinks in .repos.
      - name: Merge and push
        shell: bash
        env:
          GIT_TERMINAL_PROMPT: "0"
          TOKEN: ${{ secrets.FORK_SYNC_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$TOKEN" ]]; then
            echo "::error::FORK_SYNC_TOKEN is not set." >&2
            exit 1
          fi
          git init -q .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git remote add upstream https://github.com/pingdotgg/t3code.git
          git fetch -q --filter=blob:none origin main
          git fetch -q --filter=blob:none upstream main
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git checkout -q -B main origin/main

          behind="$(git rev-list --count main..upstream/main)"
          if [[ "$behind" == "0" ]]; then
            echo "Already up to date with upstream."
            exit 0
          fi
          echo "Merging ${behind} upstream commits."
          if ! git merge --no-edit upstream/main; then
            git merge --abort
            echo "::error::Merging upstream/main conflicts. Resolve it locally and push." >&2
            exit 1
          fi
          git push origin main
